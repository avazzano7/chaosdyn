[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosdyn"
version = "0.1.0"
description = "A Python library for simulation and analysis of chaotic dynamical systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Andrew Vazzano "}
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["chaosdyn"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100